apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: grocery-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - web
              topologyKey: kubernetes.io/hostname
      containers:
      - name: web
        image: metejas/grocery-project:latest
        # Replace <YOUR_DOCKER_REGISTRY> with:
        # - docker.io/yourusername (Docker Hub)
        # - gcr.io/your-project-id (Google Container Registry)
        # - <account-id>.dkr.ecr.<region>.amazonaws.com (AWS ECR)
        # - localhost:5000 (Local Docker Registry)
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: MYSQL_HOST
          value: "mariadb-service.grocery-app.svc.cluster.local"
        - name: MYSQL_PORT
          value: "3306"
        - name: MYSQL_USER
          value: "root"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: MYSQL_DATABASE
        volumeMounts:
        - name: app-logs
          mountPath: /var/log/apache2
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: app-logs
        emptyDir: {}
