apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grocery-ingress
  namespace: grocery-app
  annotations:
    # For nginx ingress controller
    nginx.ingress.kubernetes.io/rewrite-target: /
    # For production, add SSL redirect
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx  # Change based on your ingress controller
  rules:
  - host: grocy-here.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-service
            port:
              number: 80
  # Uncomment for HTTPS with Let's Encrypt
  # tls:
  # - hosts:
  #   - grocery.example.com
  #   secretName: grocery-tls
